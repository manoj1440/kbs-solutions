name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# F-901: blocking checks. Quarantined (known-flaky) tests are tagged "[quarantine]" in their title and excluded from
# the blocking jobs; they still run, non-blocking, in the nightly workflow (DOCS/conventions/01-engineering-conventions.md).
# F-907: a push to main is never cancelled half-way through a deploy; PR runs still cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-1234
  JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-12
  DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  OTP_PROVIDER: console
  OTP_DEV_MASTER_CODE: '000000'
  BOOTSTRAP_ADMIN_MOBILE: '9999999999'
  BOOTSTRAP_ADMIN_NAME: CI Admin

jobs:
  verify:
    name: typecheck · lint · unit · DB invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: kbs, POSTGRES_PASSWORD: kbs, POSTGRES_DB: kbs_base }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kbs" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      # DB invariant tests expect a baseline-seeded database (zero payout rules, draft HDFC profile) — AGENTS.md §6
      DATABASE_URL: postgresql://kbs:kbs@localhost:5432/kbs_base
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @kbs/db migrate:deploy
      - run: pnpm db:seed
      - run: pnpm test
      - name: REQ-27 QA matrix ratchet
        run: node scripts/qa-matrix.mjs --min=${{ vars.QA_MATRIX_MIN || 58 }} > qa-matrix.md
      - uses: actions/upload-artifact@v4
        with: { name: qa-matrix, path: qa-matrix.md }

  api-e2e:
    name: API e2e (REQ-27 ids)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: kbs, POSTGRES_PASSWORD: kbs, POSTGRES_DB: kbs_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kbs" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://kbs:kbs@localhost:5432/kbs_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @kbs/db migrate:deploy
      - run: pnpm --filter @kbs/shared build && pnpm --filter @kbs/db build
      - run: pnpm --filter api test:e2e --testNamePattern='^(?!.*\[quarantine\])'

  web-e2e:
    name: Web Playwright smoke (Admin, 1280 + 390 px)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: kbs, POSTGRES_PASSWORD: kbs, POSTGRES_DB: kbs_e2e }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kbs" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://kbs:kbs@localhost:5432/kbs_e2e
      API_PORT: '4000'
      WEB_ORIGIN: http://localhost:3000
      STORAGE_PROVIDER: memory
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      API_URL: http://localhost:4000/api/v1
      THROTTLE_LIMIT_PER_MIN: '10000'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @kbs/db migrate:deploy && pnpm --filter @kbs/shared build && pnpm db:seed
      - run: pnpm build --filter=api --filter=web
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Start API and web
        run: |
          (cd apps/api && nohup node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && nohup npx next start -p 3000 > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:4000/api/v1/health && curl -sf -o /dev/null localhost:3000/login && break; sleep 2; done
      - run: pnpm --filter web test:e2e
        env: { E2E_BASE_URL: 'http://localhost:3000', E2E_DB_URL: postgresql://kbs:kbs@localhost:5432/kbs_e2e }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: |
            apps/web/test-results
            api.log
            web.log

  # ── F-907 continuous deployment (staging, free tiers — DOCS/runbooks/05-staging-deploy.md) ──
  # Only after every check above passed on main. Order: API (Render runs migrations + first-time seed on start) → web (Vercel) → mobile OTA (EAS).
  # Each step skips itself until its secret exists, so the pipeline stays green while accounts are being set up.
  deploy-staging:
    name: Deploy staging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, api-e2e, web-e2e]
    runs-on: ubuntu-latest
    environment: { name: staging, url: '${{ vars.STAGING_WEB_URL }}' }
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Deploy API (Render) and wait for this commit
        if: env.RENDER_DEPLOY_HOOK_URL != '' && env.STAGING_API_URL != ''
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL&ref=$GITHUB_SHA" > /dev/null
          # free instances may be asleep and builds take a few minutes; health reports RENDER_GIT_COMMIT
          for i in $(seq 1 90); do
            c=$(curl -s -m 20 "$STAGING_API_URL/health" | jq -r '.data.commit // .commit // empty' || true)
            [ "$c" = "$GITHUB_SHA" ] && echo "API live at $c" && exit 0
            sleep 10
          done
          echo "::error::API did not report commit $GITHUB_SHA within 15 min (check the Render deploy log)"; exit 1

      - name: Deploy web (Vercel)
        if: env.VERCEL_TOKEN != ''
        run: |
          npx -y vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx -y vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx -y vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Mobile changed since the previous push?
        id: mobile
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --quiet "$before" "$GITHUB_SHA" -- apps/mobile packages/shared packages/ui-tokens pnpm-lock.yaml \
            && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish mobile OTA update (EAS, channel preview)
        if: steps.mobile.outputs.changed == 'true' && env.EXPO_TOKEN != '' && env.STAGING_API_URL != ''
        working-directory: apps/mobile
        env:
          EXPO_NO_DOTENV: '1'
          APP_VARIANT: preview
          EXPO_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
        run: npx -y eas-cli@latest update --channel preview --platform android --environment preview --message "${{ github.event.head_commit.message || github.sha }}" --non-interactive
