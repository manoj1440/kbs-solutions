# F-315 Manager: Advisors tab → Advisor drill-down → read-only lead with separate bank badges
appId: com.kbs.dsa
env:
  MANAGER_MOBILE: ${MANAGER_MOBILE || '9876500001'} # override: maestro test -e MANAGER_MOBILE=98xxxxxxxx …
---
- launchApp:
    clearState: true
- tapOn: "Get Started.*"
- repeat:
    times: 3
    commands:
      - tapOn:
          text: "Next.*"
          optional: true
- tapOn: "Let's Login.*"
- tapOn: "98765 43210"
- inputText: ${MANAGER_MOBILE}
- tapOn: "Login"
- inputText: "000000"
- tapOn: "Verify OTP"
- assertVisible: "Team overview"
- tapOn: "Advisors"
- assertVisible: "Advisors"
- tapOn:
    id: ".*"
    text: "Open .*"
    index: 0
- scrollUntilVisible:
    element: "Current stage"
- scrollUntilVisible:
    element: "Final decision"
- scrollUntilVisible:
    element: "Card activation"
- scrollUntilVisible:
    element: "Leads · .*"
- scrollUntilVisible:
    element: "Open lead .*"
- tapOn:
    text: "Open lead .*"
    index: 0
- assertVisible: "Bank status \\(from MIS only\\)"
