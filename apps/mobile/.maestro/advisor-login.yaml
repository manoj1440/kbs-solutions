# Advisor: welcome carousel → OTP login → Home → Earnings → Notifications
appId: com.kbs.dsa
env:
  ADVISOR_MOBILE: ${ADVISOR_MOBILE || '9555999001'} # override: maestro test -e ADVISOR_MOBILE=98xxxxxxxx …
---
- launchApp:
    clearState: true
- tapOn: "Get Started.*"
- tapOn:
    text: "Next.*"
    optional: true
- tapOn:
    text: "Next.*"
    optional: true
- tapOn:
    text: "Next.*"
    optional: true
- tapOn: "Let's Login.*"
- tapOn: "98765 43210"
- inputText: ${ADVISOR_MOBILE}
- tapOn: "Login"
- inputText: "000000"
- tapOn: "Verify OTP"
- assertVisible: "Home"
- tapOn: "Earnings"
- assertVisible:
    text: ".*bank MIS.*"
- tapOn: "Home"
- tapOn: "Notifications.*"
- assertVisible: "Notifications"
