# Manager: login → Approvals tab lists requests awaiting the Manager → open one (read-only check)
appId: com.kbs.dsa
env:
  MANAGER_MOBILE: ${MANAGER_MOBILE || '9876500001'} # override: maestro test -e MANAGER_MOBILE=98xxxxxxxx …
---
- launchApp:
    clearState: true
- tapOn: "Get Started.*"
- repeat:
    times: 3
    commands:
      - tapOn:
          text: "Next.*"
          optional: true
- tapOn: "Let's Login.*"
- tapOn: "98765 43210"
- inputText: ${MANAGER_MOBILE}
- tapOn: "Login"
- inputText: "000000"
- tapOn: "Verify OTP"
- assertVisible: "Team overview"
- tapOn: "Approvals"
- assertVisible:
    text: ".*approval.*"
