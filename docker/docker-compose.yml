name: kbs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kbs
      POSTGRES_PASSWORD: kbs
      POSTGRES_DB: kbs
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbs -d kbs"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kbsminio
      MINIO_ROOT_PASSWORD: kbsminio123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kbsminio kbsminio123 &&
      mc mb --ignore-existing local/kbs-private &&
      echo 'bucket ready'"
volumes:
  pgdata:
  miniodata:
