name: kbs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kbs
      POSTGRES_PASSWORD: kbs
      POSTGRES_DB: kbs
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbs -d kbs"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    # S3-compatible dev storage. MinIO stopped publishing public images (minio/minio, minio/mc and quay.io
    # all refuse pulls as of 2026-11), so this is RustFS, a drop-in that reads the MINIO_ROOT_* variables.
    # Service name kept so nothing else changes. Console: http://localhost:9001
    image: rustfs/rustfs:1.0.2
    environment:
      MINIO_ROOT_USER: kbsminio
      MINIO_ROOT_PASSWORD: kbsminio123
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  minio-init:
    image: amazon/aws-cli:2.38.1
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: kbsminio
      AWS_SECRET_ACCESS_KEY: kbsminio123
      AWS_DEFAULT_REGION: ap-south-1
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1 && break; sleep 1; done;
      aws --endpoint-url http://minio:9000 s3api head-bucket --bucket kbs-private 2>/dev/null ||
      aws --endpoint-url http://minio:9000 s3 mb s3://kbs-private;
      echo 'bucket ready'"
  clamav:
    # F-902 malware scanner (clamd on TCP 3310). First start downloads signatures (a few minutes).
    # Use with SCAN_PROVIDER=clamav, CLAMAV_HOST=localhost, CLAMAV_PORT=3310.
    image: clamav/clamav:stable
    profiles: ["scan"]
    ports: ["3310:3310"]
    volumes: ["clamdb:/var/lib/clamav"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
volumes:
  pgdata:
  clamdb:
  miniodata:
